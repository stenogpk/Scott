name: SCOTT Web Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: scott-web-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src
      - name: Checkout voice chat preview
        uses: actions/checkout@v4
        with:
          ref: feature/cloudflare-agora-token-server
          path: preview-src
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build unchanged production website
        working-directory: main-src
        run: |
          flutter create --platforms=web --org com.shartendu --project-name scott_game .
          sed -i 's#</body>#<script src="https://download.agora.io/sdk/release/iris-web-rtc_n450_w4220_0.8.6.js"></script></body>#' web/index.html
          python3 tool/generate_sounds.py
          flutter pub get
          flutter build web --release --base-href "/Scott/" --target lib/web_main.dart --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} --dart-define=FIREBASE_DATABASE_URL=${{ secrets.FIREBASE_DATABASE_URL }}
      - name: Build feature-branch voice chat test website
        working-directory: preview-src
        run: |
          flutter create --platforms=web --org com.shartendu --project-name scott_game .
          sed -i 's#</body>#<script src="https://download.agora.io/sdk/release/iris-web-rtc_n450_w4220_0.8.6.js"></script></body>#' web/index.html
          python3 tool/generate_sounds.py
          flutter pub get
          flutter build web --release --base-href "/Scott/voice-test/" --target lib/web_main.dart --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} --dart-define=FIREBASE_DATABASE_URL=${{ secrets.FIREBASE_DATABASE_URL }}
      - name: Combine preview under a separate URL
        run: |
          mkdir -p main-src/build/web/voice-test
          cp -R preview-src/build/web/. main-src/build/web/voice-test/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload combined Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: main-src/build/web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
