name: SCOTT Android CI
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: scott-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android --org com.shartendu --project-name scott_game .
      - name: Set Android compile SDK for Agora dependencies
        run: |
          BUILD_FILE=''
          for candidate in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$candidate" ]; then BUILD_FILE="$candidate"; break; fi
          done
          if [ -z "$BUILD_FILE" ]; then echo 'Android Gradle build file not found'; ls -la android/app; exit 1; fi
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/; s/compileSdk flutter.compileSdkVersion/compileSdk 36/; s/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' "$BUILD_FILE"
          grep -n 'compileSdk' "$BUILD_FILE"
      - name: Apply SCOTT Android network permissions
        run: cp tool/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - name: Generate original sound effects
        run: python3 tool/generate_sounds.py
      - name: Install dependencies
        run: flutter pub get
      - name: Set Android plugin compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path.home() / '.pub-cache' / 'hosted' / 'pub.dev'
          patterns = [
              re.compile(r'(?m)^(\s*compileSdkVersion\s+)(?:flutter\.compileSdkVersion|\d+)'),
              re.compile(r'(?m)^(\s*compileSdk\s*=\s*)(?:flutter\.compileSdkVersion|\d+)'),
              re.compile(r'(?m)^(\s*compileSdk\s+)(?:flutter\.compileSdkVersion|\d+)'),
          ]
          changed = []
          for gradle in root.glob('*/android/build.gradle*'):
              source = gradle.read_text()
              updated = source
              for pattern in patterns:
                  updated = pattern.sub(r'\g<1>36', updated)
              if updated != source:
                  gradle.write_text(updated)
                  changed.append(str(gradle))
          print(f'Updated plugin compileSdk to 36 in {len(changed)} Gradle files')
          for path in changed:
              print(path)
          PY
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Configure Web platform
        run: |
          flutter create . --platforms web
          sed -i 's#</body>#<script src="https://download.agora.io/sdk/release/iris-web-rtc_n450_w4220_0.8.6.js"></script></body>#' web/index.html
      - name: Build Web
        run: flutter build web --target lib/web_main.dart --release --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} --dart-define=FIREBASE_DATABASE_URL=${{ secrets.FIREBASE_DATABASE_URL }}
      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: SCOTT-web-preview
          path: build/web/
          if-no-files-found: error
          retention-days: 14
      - name: Build release APK
        run: flutter build apk --release --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} --dart-define=FIREBASE_DATABASE_URL=${{ secrets.FIREBASE_DATABASE_URL }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SCOTT-final-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
